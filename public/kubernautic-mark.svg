    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21D2C9"/>
      <stop offset="0.5" stop-color="#55E5E4"/>
      <stop offset="1" stop-color="#20B9DB"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65F0E5"/>
      <stop offset="1" stop-color="#39D9E8"/>
