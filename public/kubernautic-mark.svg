<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Kubernautic hexagon signet</title>
  <desc id="desc">Turquoise K inside a dark navy hexagon with a glowing cyan outline.</desc>
