<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Kubernautic hexagon K signet</title>
  <desc id="desc">A turquoise-to-cyan hexagon enclosing a white geometric field and a matching gradient letter K.</desc>
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05D5B2"/>
      <stop offset="0.52" stop-color="#00BCD6"/>
      <stop offset="1" stop-color="#0B9FF4"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05CDA9"/>
      <stop offset="1" stop-color="#079DF0"/>
    </linearGradient>
  </defs>
  <!-- Rounded hexagonal body -->
  <path fill="url(#hex)" d="M60.5 5.2a7 7 0 0 1 7 0l48.1 27.8a7 7 0 0 1 3.5 6.1v49.8a7 7 0 0 1-3.5 6.1l-48.1 27.8a7 7 0 0 1-7 0L12.4 95a7 7 0 0 1-3.5-6.1V39.1a7 7 0 0 1 3.5-6.1Z"/>
  <!-- White inset echoes the cube geometry of OpenKubes -->
  <path fill="#FFFFFF" d="M64 24.5 98.5 44.4v39.2L64 103.5 29.5 83.6V44.4Z"/>
  <path d="M29.5 44.4 23 40.6V23.9M98.5 44.4 116 34.3M29.5 83.6 10.5 94.6M64 103.5V121.5" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
  <path fill="url(#letter)" d="M42 44.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v22.2l22.2-24.2h16.2a2 2 0 0 1 1.5 3.3L76.7 66.5l20.9 27a2 2 0 0 1-1.6 3.2H79.7L64.2 77.1 57 84.3v10.4a2 2 0 0 1-2 2H44a2 2 0 0 1-2-2Z"/>
</svg>
