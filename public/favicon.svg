<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kubernautic – OpenKubes family signet</title>
  <desc id="desc">Open multicolor hexagon with a large turquoise letter K and gently curved, pointed diagonal arms.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26ACF2"/><stop offset="1" stop-color="#087FE7"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2FD886"/><stop offset="1" stop-color="#16B75A"/></linearGradient>
    <linearGradient id="lowerBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#297DE4"/><stop offset="1" stop-color="#1355B9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC043"/><stop offset="1" stop-color="#F39B1F"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8B1A"/><stop offset="1" stop-color="#F46A10"/></linearGradient>
    <linearGradient id="kColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48F2CB"/><stop offset=".52" stop-color="#1EE9E3"/><stop offset="1" stop-color="#13B0EF"/></linearGradient>
  </defs>
