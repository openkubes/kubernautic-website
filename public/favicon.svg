  <path fill="url(#lowerBlue)" d="M4 329 77 297V342L227 417V503Q223 508 217 504L19 404Q4 397 4 378Z"/>
  <path fill="url(#orange)" d="M255 418 403 343V294L478 327V383Q478 396 462 404L266 505Q255 511 255 497Z"/>
  <!-- Clean one-piece K: elegant, curved upper spike and swept lower leg. -->
  <path fill="url(#kColor)" d="M162 181H215V247L274 188Q284 178 302 177L366 176Q327 203 304 225L268 258L366 334H308Q284 334 272 324L215 275V334H162Z"/>
</svg>
